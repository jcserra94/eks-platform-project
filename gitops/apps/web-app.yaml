apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-platform-app
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/jcserra94/eks-platform-project.git'
    targetRevision: HEAD
    path: gitops/manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: web-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true