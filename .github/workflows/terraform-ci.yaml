name: "Terraform CI - PR Validation"

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'terraform/**'

jobs:
  terraform-validate:
    name: "Terraform Validate & Plan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0 # Match your local version or leave standard

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check

      - name: Terraform Init
        id: init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate

      # Optional: If you want PRs to show a dry-run plan, 
      # you'd inject AWS credentials here via GitHub Secrets. 
      # For now, fmt, init, and validate give you a stellar automated gatekeeper!